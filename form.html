<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>            
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br><br>
        <label for="telephone">Telephone:</label>
        <input type="tel" id="telephone" name="telephone" required placeholder="Enter your telephone number"><br><br>
        <label for="file">File:</label>
        <input type="file" id="file" name="file" required><br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" required placeholder="Enter your address"></textarea><br><br>
        <p>Gender:</p>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male" required><br><br>  
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female" required><br><br>
        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">Select a country</option>
            <option value="nepal">nepal</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
        </select><br><br>
        <p>subjects</p>
        <label for="math">Math</label>
        <input type="checkbox" id="math" name="subjects" value="math"><br><br>
        <label for="science">Science</label>
        <input type="checkbox" id="science" name="subjects" value="science"><br><br>        
        <button type="submit" value="Submit"> Submit</button>
        <button type="reset" value="Reset"> Reset</button>
    </form>
</body>
</html>
